name: The Italian Job - Build and Release

on:
  push:
    branches: [main]
    tags: ['italian-job-v*']
    paths:
      - 'patches/ItalianJob/**'
      - '.github/workflows/italian-job-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. italian-job-v1.0.0 (blank = artifact only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Build, test and package
        id: package
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $manualTag = [string]$env:INPUT_RELEASE_TAG
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $manualTag.Trim() }
          if ($releaseTag -and $releaseTag -notmatch '^italian-job-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Use a release tag such as italian-job-v1.0.0.' }
          if ($releaseTag -and $env:GITHUB_REF_TYPE -ne 'tag' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish manual releases from main.' }
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          $version = if ($releaseTag) { $releaseTag } else { "dev-$env:GITHUB_RUN_NUMBER" }
          ./patches/ItalianJob/release-tools/build-release.ps1 -Version $version
      - name: Test packaged installer
        shell: pwsh
        run: ./patches/ItalianJob/release-tools/test-release.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: ItalianJob-Fixes
          path: |
            patches/ItalianJob/dist/ItalianJob-Fixes-*.zip
            patches/ItalianJob/dist/ItalianJob-Fixes-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ItalianJob-Fixes
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Choose a new version or rerun its original tagged build."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --target "$RELEASE_COMMIT" \
            --title "The Italian Job Fixes $RELEASE_TAG" \
            --notes-file patches/ItalianJob/release-tools/release-notes.md

