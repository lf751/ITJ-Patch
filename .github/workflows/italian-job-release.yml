name: The Italian Job - Build and Release

on:
  push:
    branches: [main]
    tags: ['italian-job-v*']
    paths:
      - 'patches/ItalianJob/**'
      - '.github/workflows/italian-job-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-${{ github.run_number }}' }
          ./patches/ItalianJob/release-tools/build-release.ps1 -Version $version
      - name: Test packaged installer
        shell: pwsh
        run: ./patches/ItalianJob/release-tools/test-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ItalianJob-Fixes
          path: |
            patches/ItalianJob/dist/ItalianJob-Fixes-*.zip
            patches/ItalianJob/dist/ItalianJob-Fixes-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/italian-job-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ItalianJob-Fixes
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release/*
          --verify-tag
          --title "The Italian Job Fixes $RELEASE_TAG"
          --notes-file patches/ItalianJob/release-tools/release-notes.md

